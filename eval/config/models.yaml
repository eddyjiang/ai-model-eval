models:
  claude:
    display_name: "Claude Sonnet 4.6"
    # OpenRouter model slug: verify at https://openrouter.ai/models
    litellm_model: "openrouter/anthropic/claude-sonnet-4.6"
    provider: "openrouter"
    requests_per_minute: 50
    max_tokens: 1024
    temperature: 0.7
    # Claude is judged by GPT-4o to avoid self-serving bias
    judge: "gpt"

  gpt:
    display_name: "GPT-5.5"
    litellm_model: "openrouter/openai/gpt-5.5"
    provider: "openrouter"
    requests_per_minute: 60
    max_tokens: 1024
    temperature: 0.7
    judge: "claude"

  gemini:
    display_name: "Gemini 3.1 Pro"
    litellm_model: "openrouter/google/gemini-3.1-pro-preview"
    provider: "openrouter"
    requests_per_minute: 60
    max_tokens: 1024
    temperature: 0.7
    judge: "claude"

  grok:
    display_name: "Grok-4.3"
    litellm_model: "openrouter/x-ai/grok-4.3"
    provider: "openrouter"
    requests_per_minute: 30
    max_tokens: 1024
    temperature: 0.7
    judge: "claude"

  llama:
    display_name: "Llama 4 Maverick"
    litellm_model: "openrouter/meta-llama/llama-4-maverick"
    provider: "openrouter"
    requests_per_minute: 60
    max_tokens: 1024
    temperature: 0.7
    judge: "claude"

# Pilot subset: two models for quick test runs
pilot_models:
  - "claude"
  - "gpt"
